<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spider Genesis - Web Jump Real</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background-color: #030303; color: #f3f3f3; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: #080808; padding: 10px 15px; border-bottom: 2px solid #d4af37; display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: #d4af37; font-size: 15px; font-weight: 800; letter-spacing: 1px; }
        .vip-badge { background: #d4af37; color: #000; font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }

        .app-container { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 75px; }

        .card { background: #0d0d0d; border: 1px solid #d4af3744; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .card h3 { color: #d4af37; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; }

        .balance-display { text-align: center; background: #121212; border: 1px solid #d4af3788; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .balance-display h2 { color: #ffcc00; font-size: 26px; font-weight: 900; margin-top: 4px; text-shadow: 0 0 10px rgba(255,204,0,0.3); }

        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .game-card { background: #090909; border: 1px solid #d4af3755; border-radius: 10px; padding: 8px; text-align: center; cursor: pointer; }
        .game-card h4 { color: #d4af37; font-size: 11px; margin-top: 4px; }
        .game-icon { width: 100%; height: 55px; background: #000; border: 1px solid #222; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; }

        /* EXACT MATCH WEB JUMP GAME MODAL */
        .webjump-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 700; flex-direction: column; justify-content: space-between; padding: 10px; }
        
        .game-top-bar { display: flex; justify-content: space-between; align-items: center; background: #0e0e0e; padding: 8px 12px; border: 1px solid #d4af3755; border-radius: 8px; }
        
        #webCanvas { width: 100%; flex: 1; background: radial-gradient(circle, #151515, #020202); border: 2px solid #d4af37; border-radius: 10px; margin: 6px 0; box-shadow: 0 0 25px rgba(212,175,55,0.3); display: block; }

        /* Exact Layout Controls matching your reference image */
        .controls-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .ctrl-btn { background: linear-gradient(145deg, #181818, #0f0f0f); border: 1px solid #d4af37; color: #ffcc00; padding: 12px 5px; font-weight: bold; border-radius: 10px; text-align: center; cursor: pointer; font-size: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .ctrl-btn:active { background: #d4af37; color: #000; transform: scale(0.96); }

        .btn-gold { background: linear-gradient(135deg, #d4af37, #9a7805); color: #000; border: none; padding: 14px; font-weight: 900; border-radius: 10px; cursor: pointer; width: 100%; font-size: 13px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(212,175,55,0.4); }

        nav { display: flex; background: #0a0a0a; border-top: 1px solid #222; position: fixed; bottom: 0; width: 100%; height: 60px; z-index: 200; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #777; font-size: 10px; cursor: pointer; }
        .nav-item.active { color: #d4af37; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>SPIDER GENESIS</h1>
        <div class="vip-badge">VIP 3 / LVL 42</div>
    </header>

    <div class="app-container">
        <div class="balance-display">
            <p style="font-size: 11px; color: #888;">TOTAL REWARD POOL & BALANCE</p>
            <h2 id="main-balance">23,985.75 $SPDR</h2>
        </div>

        <div class="card">
            <h3>Internal Game Realms</h3>
            <div class="game-grid">
                <div class="game-card" onclick="alert('Tic-Tac-Toe Arena')">
                    <div class="game-icon">❌⭕</div>
                    <h4>PvP Arena</h4>
                </div>
                <div class="game-card" style="border-color:#ffcc00;" onclick="openExactGame()">
                    <div class="game-icon">🕸️⚡</div>
                    <h4>Spider Web Jump</h4>
                </div>
                <div class="game-card" onclick="alert('Fortune Wheel')">
                    <div class="game-icon">🎡</div>
                    <h4>Fortune Wheel</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- EXACT REFERENCE GAME SCREEN -->
    <div id="exactModal" class="webjump-overlay">
        <div class="game-top-bar">
            <div>
                <h3 id="spider-coins" style="color: #ffcc00; font-size: 15px;">4200</h3>
                <p style="font-size: 9px; color: #aaa;">Spider Coins</p>
            </div>
            <div style="text-align: center;">
                <h3 style="color: #d4af37; font-size: 13px;">Spider Web Jump</h3>
                <p style="font-size: 8px; color: #888;">mini App</p>
            </div>
            <div style="text-align: right;">
                <h3 id="token-coins" style="color: #ffcc00; font-size: 15px;">420</h3>
                <p style="font-size: 9px; color: #aaa;">Token Coins</p>
            </div>
        </div>

        <!-- Canvas displaying Webs, Connecting Silk Threads, and Spider -->
        <canvas id="webCanvas"></canvas>

        <!-- EXACT BUTTONS -->
        <div class="controls-row">
            <div class="ctrl-btn" onclick="jumpSpider()">🕷️ Jump</div>
            <div class="ctrl-btn" onclick="moveSpider(-35)">◄ Move Left</div>
            <div class="ctrl-btn" onclick="moveSpider(35)">Move Right ►</div>
        </div>

        <button class="btn-gold" onclick="closeExactGame()">CLAIM & EXIT</button>
    </div>

    <nav>
        <div class="nav-item active">🏠 Home</div>
        <div class="nav-item" onclick="openExactGame()">🎮 Games</div>
        <div class="nav-item" onclick="alert('Tasks')">📋 Tasks</div>
        <div class="nav-item" onclick="alert('Friends')">👥 Friends</div>
        <div class="nav-item" onclick="alert('Profile')">👛 Profile</div>
    </nav>

    <script>
        let balance = 23985.75;
        function updateBalance() {
            document.getElementById('main-balance').innerText = balance.toFixed(2) + " $SPDR";
        }

        // --- EXACT ENGINE MATCHING REFERENCE IMAGE ---
        let canvas, ctx, animId;
        let sX, sY, sVelY, webs, spiderCoins, tokenCoins;

        function openExactGame() {
            document.getElementById('exactModal').style.display = 'flex';
            canvas = document.getElementById('webCanvas');
            canvas.width = window.innerWidth - 30;
            canvas.height = window.innerHeight - 240;
            ctx = canvas.getContext('2d');

            sX = canvas.width / 2;
            sY = canvas.height - 60;
            sVelY = 0;
            spiderCoins = 4200;
            tokenCoins = 420;

            // Generate Golden Webs with multipliers (x1.5, x2.0, x3.0) and connecting threads
            webs = [
                {x: canvas.width * 0.3, y: canvas.height * 0.7, r: 35, mult: "x1.5"},
                {x: canvas.width * 0.55, y: canvas.height * 0.45, r: 42, mult: "x2.0"},
                {x: canvas.width * 0.75, y: canvas.height * 0.25, r: 48, mult: "x3.0"},
                {x: canvas.width * 0.4, y: canvas.height * 0.25, r: 28, mult: "x1.5"},
                {x: canvas.width * 0.6, y: canvas.height * 0.7, r: 32, mult: "x3.0"}
            ];

            if(animId) cancelAnimationFrame(animId);
            gameLoop();
        }

        function jumpSpider() {
            sVelY = -9;
        }

        function moveSpider(val) {
            sX += val;
            if(sX < 30) sX = 30;
            if(sX > canvas.width - 30) sX = canvas.width - 30;
        }

        function gameLoop() {
            sVelY += 0.35; // Gravity
            sY += sVelY;

            if(sY > canvas.height - 30) {
                sY = canvas.height - 30;
                sVelY = 0;
            }
            if(sY < 30) sY = 30;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw connecting web silk threads between webs (Background aesthetic)
            ctx.strokeStyle = 'rgba(212, 175, 55, 0.2)';
            ctx.lineWidth = 1;
            for(let i=0; i<webs.length; i++) {
                for(let j=i+1; j<webs.length; j++) {
                    ctx.beginPath();
                    ctx.moveTo(webs[i].x, webs[i].y);
                    ctx.lineTo(webs[j].x, webs[j].y);
                    ctx.stroke();
                }
            }

            // Draw Golden Webs with Multipliers
            for(let w of webs) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(w.x, w.y, w.r, 0, Math.PI * 2);
                ctx.strokeStyle = '#d4af37';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#0a0a0a';
                ctx.fill();

                // Multiplier text inside web
                ctx.fillStyle = '#ffcc00';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(w.mult, w.x, w.y);
                ctx.restore();

                // Check collision with spider to earn coins
                let dx = sX - w.x;
                let dy = sY - w.y;
                if(Math.sqrt(dx*dx + dy*dy) < w.r + 15) {
                    let reward = w.mult === "x3.0" ? 150 : (w.mult === "x2.0" ? 100 : 50);
                    spiderCoins += reward;
                    tokenCoins += 5;
                    document.getElementById('spider-coins').innerText = spiderCoins;
                    document.getElementById('token-coins').innerText = tokenCoins;

                    // Shift web position after collection
                    w.x = Math.random() * (canvas.width - 80) + 40;
                    w.y = Math.random() * (canvas.height - 120) + 40;
                }
            }

            // Draw Spider Player in the middle with a silk thread connected to top
            ctx.strokeStyle = 'rgba(255, 204, 0, 0.4)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(sX, sY);
            ctx.lineTo(sX, sY - 50);
            ctx.stroke();

            // Spider Emoji
            ctx.font = '30px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("🕷️", sX, sY);

            animId = requestAnimationFrame(gameLoop);
        }

        function closeExactGame() {
            cancelAnimationFrame(animId);
            let earnedSpider = spiderCoins - 4200;
            if(earnedSpider > 0) {
                balance += earnedSpider;
                updateBalance();
                alert(`Amazing! Added +${earnedSpider} Spider Coins to your main wallet balance.`);
            }
            document.getElementById('exactModal').style.display = 'none';
        }
    </script>
</body>
</html>
