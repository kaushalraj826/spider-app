<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spider Genesis - Web Jump Thrill</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background-color: #030303; color: #f3f3f3; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        header { background: #080808; padding: 10px 15px; border-bottom: 2px solid #d4af37; display: flex; justify-content: space-between; align-items: center; }
        header h1 { color: #d4af37; font-size: 15px; font-weight: 800; letter-spacing: 1px; }
        .vip-badge { background: #d4af37; color: #000; font-size: 10px; padding: 3px 8px; border-radius: 4px; font-weight: bold; }

        .app-container { flex: 1; overflow-y: auto; padding: 12px; padding-bottom: 75px; }

        .card { background: #0d0d0d; border: 1px solid #d4af3744; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
        .card h3 { color: #d4af37; font-size: 12px; margin-bottom: 8px; text-transform: uppercase; }

        .balance-display { text-align: center; background: #121212; border: 1px solid #d4af3788; border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .balance-display h2 { color: #ffcc00; font-size: 26px; font-weight: 900; margin-top: 4px; text-shadow: 0 0 10px rgba(255,204,0,0.3); }

        .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
        .game-card { background: #090909; border: 1px solid #d4af3755; border-radius: 10px; padding: 8px; text-align: center; cursor: pointer; }
        .game-card h4 { color: #d4af37; font-size: 11px; margin-top: 4px; }
        .game-icon { width: 100%; height: 55px; background: #000; border: 1px solid #222; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 20px; }

        /* WEB JUMP THRILL SCREEN */
        .webjump-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #050505; z-index: 700; flex-direction: column; justify-content: space-between; padding: 12px; }
        
        .game-top-bar { display: flex; justify-content: space-between; align-items: center; background: #0e0e0e; padding: 8px 12px; border: 1px solid #d4af3755; border-radius: 8px; }
        
        #webCanvas { width: 100%; flex: 1; background: radial-gradient(circle, #1a1a1a, #020202); border: 2px solid #d4af37; border-radius: 10px; margin: 8px 0; box-shadow: 0 0 25px rgba(212,175,55,0.3); display: block; }

        .controls-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .ctrl-btn { background: linear-gradient(145deg, #181818, #0f0f0f); border: 1px solid #d4af37; color: #ffcc00; padding: 12px 5px; font-weight: bold; border-radius: 10px; text-align: center; cursor: pointer; font-size: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .ctrl-btn:active { background: #d4af37; color: #000; transform: scale(0.96); }

        .btn-gold { background: linear-gradient(135deg, #d4af37, #9a7805); color: #000; border: none; padding: 14px; font-weight: 900; border-radius: 10px; cursor: pointer; width: 100%; font-size: 13px; text-transform: uppercase; box-shadow: 0 4px 15px rgba(212,175,55,0.4); }

        nav { display: flex; background: #0a0a0a; border-top: 1px solid #222; position: fixed; bottom: 0; width: 100%; height: 60px; z-index: 200; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #777; font-size: 10px; cursor: pointer; }
        .nav-item.active { color: #d4af37; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>SPIDER GENESIS</h1>
        <div class="vip-badge">VIP 3 / LVL 42</div>
    </header>

    <div class="app-container">
        <div class="balance-display">
            <p style="font-size: 11px; color: #888;">TOTAL REWARD POOL & BALANCE</p>
            <h2 id="main-balance">23,985.75 $SPDR</h2>
        </div>

        <div class="card">
            <h3>Internal Game Realms</h3>
            <div class="game-grid">
                <div class="game-card" onclick="alert('Tic-Tac-Toe Arena')">
                    <div class="game-icon">❌⭕</div>
                    <h4>PvP Arena</h4>
                </div>
                <div class="game-card" style="border-color:#ffcc00;" onclick="openThrillGame()">
                    <div class="game-icon">🕸️⚡</div>
                    <h4>Spider Web Jump</h4>
                </div>
                <div class="game-card" onclick="alert('Fortune Wheel')">
                    <div class="game-icon">🎡</div>
                    <h4>Fortune Wheel</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- THRILL WEB JUMP GAME SCREEN -->
    <div id="thrillModal" class="webjump-overlay">
        <div class="game-top-bar">
            <div>
                <p style="font-size: 9px; color: #aaa;">Round Score</p>
                <h3 id="thrill-score" style="color: #ffcc00; font-size: 16px;">4200</h3>
            </div>
            <h3 id="status-msg" style="color: #d4af37; font-size: 13px;">WIN OR LOST MODE</h3>
            <button onclick="closeThrillGame()" style="background:none; border:none; color:#ffcc00; font-size:20px; cursor:pointer;">✕</button>
        </div>

        <canvas id="webCanvas"></canvas>

        <div class="controls-row">
            <div class="ctrl-btn" onclick="playerJump()">🕷️ Jump</div>
            <div class="ctrl-btn" onclick="playerMove(-35)">◄ Move Left</div>
            <div class="ctrl-btn" onclick="playerMove(35)">Move Right ►</div>
        </div>

        <button class="btn-gold" onclick="closeThrillGame()">CLAIM & EXIT</button>
    </div>

    <nav>
        <div class="nav-item active">🏠 Home</div>
        <div class="nav-item" onclick="openThrillGame()">🎮 Games</div>
        <div class="nav-item" onclick="alert('Tasks')">📋 Tasks</div>
        <div class="nav-item" onclick="alert('Friends')">👥 Friends</div>
        <div class="nav-item" onclick="alert('Profile')">👛 Profile</div>
    </nav>

    <script>
        let balance = 23985.75;
        function updateBalance() {
            document.getElementById('main-balance').innerText = balance.toFixed(2) + " $SPDR";
        }

        // --- THRILL WEB JUMP ENGINE (WIN / LOST) ---
        let canvas, ctx, animId;
        let pX, pY, pVelY, webs, gameScore, isLive;

        function openThrillGame() {
            document.getElementById('thrillModal').style.display = 'flex';
            canvas = document.getElementById('webCanvas');
            canvas.width = window.innerWidth - 30;
            canvas.height = window.innerHeight - 250;
            ctx = canvas.getContext('2d');

            pX = canvas.width / 2;
            pY = canvas.height - 40;
            pVelY = 0;
            gameScore = 4200;
            isLive = true;

            document.getElementById('thrill-score').innerText = gameScore;
            document.getElementById('status-msg').style.color = "#d4af37";
            document.getElementById('status-msg').innerText = "WIN OR LOST MODE";

            // Generate mix of Winning Golden Webs & Dangerous Red Webs
            webs = [];
            let types = [
                {mult: 1.5, color: '#ffcc00', type: 'win'},
                {mult: 3.0, color: '#d4af37', type: 'win'},
                {mult: -2.0, color: '#ff4444', type: 'lost'} // Dangerous trap!
            ];

            for(let i=0; i<5; i++) {
                let chosen = types[Math.floor(Math.random() * types.length)];
                webs.push({
                    x: Math.random() * (canvas.width - 80) + 40,
                    y: Math.random() * (canvas.height - 150) + 30,
                    radius: 28,
                    mult: chosen.mult,
                    color: chosen.color,
                    type: chosen.type
                });
            }

            if(animId) cancelAnimationFrame(animId);
            thrillLoop();
        }

        function playerJump() {
            if(isLive) pVelY = -9.5;
        }

        function playerMove(val) {
            if(isLive) {
                pX += val;
                if(pX < 25) pX = 25;
                if(pX > canvas.width - 25) pX = canvas.width - 25;
            }
        }

        function thrillLoop() {
            if(!isLive) return;

            pVelY += 0.4;
            pY += pVelY;

            if(pY > canvas.height - 25) {
                pY = canvas.height - 25;
                pVelY = 0;
            }
            if(pY < 25) pY = 25;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Webs (Win & Lost traps)
            for(let w of webs) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2);
                ctx.strokeStyle = w.color;
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.fillStyle = '#111';
                ctx.fill();

                ctx.fillStyle = w.color;
                ctx.font = '13px Arial';
                ctx.textAlign = 'center';
                ctx.fillText(w.type === 'win' ? "🕸️ WIN" : "⚠️ LOST", w.x, w.y - 4);
                ctx.font = 'bold 11px Arial';
                ctx.fillText((w.mult > 0 ? "+" : "") + w.mult + "x", w.x, w.y + 14);
                ctx.restore();

                // Collision Check
                let dx = pX - w.x;
                let dy = pY - w.y;
                if(Math.sqrt(dx*dx + dy*dy) < 32) {
                    if(w.type === 'win') {
                        let earned = Math.floor(w.mult * 100);
                        gameScore += earned;
                        document.getElementById('status-msg').style.color = "#00ff66";
                        document.getElementById('status-msg').innerText = "YOU WON +" + earned + "!";
                    } else {
                        let lost = Math.abs(Math.floor(w.mult * 150));
                        gameScore -= lost;
                        if(gameScore < 0) gameScore = 0;
                        document.getElementById('status-msg').style.color = "#ff4444";
                        document.getElementById('status-msg').innerText = "OOPS! LOST -" + lost + "!";
                    }
                    document.getElementById('thrill-score').innerText = gameScore;

                    // Respawn web
                    w.x = Math.random() * (canvas.width - 80) + 40;
                    w.y = Math.random() * (canvas.height - 150) + 30;
                }
            }

            // Draw Spider
            ctx.font = '32px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText("🕷️", pX, pY);

            animId = requestAnimationFrame(thrillLoop);
        }

        function closeThrillGame() {
            isLive = false;
            cancelAnimationFrame(animId);
            let finalProfit = gameScore - 4200;
            if(finalProfit !== 0) {
                balance += finalProfit;
                updateBalance();
                alert(`Game Session Ended! Final Balance updated with ${finalProfit > 0 ? '+' : ''}${finalProfit} $SPDR`);
            }
            document.getElementById('thrillModal').style.display = 'none';
        }
    </script>
</body>
</html>
