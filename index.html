<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider Web Network</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0b0e14; color: #ffffff; }
        .spider-card { background: #161b22; border: 1px solid #30363d; }
        .tab-content { display: none; }
        .active-tab { display: block; }
    </style>
</head>
<body class="pb-20">
    <header class="p-4 border-b border-gray-800 flex justify-between items-center">
        <h1 class="text-xl font-bold text-purple-500">🕷️ SPIDER</h1>
    </header>
    <main id="main" class="p-4">
        <div id="tab-home" class="tab-content active-tab space-y-4">
            <div class="spider-card p-6 rounded-xl text-center">
                <h2 class="text-2xl font-bold">SpiderMaster</h2>
                <p class="text-purple-400">Level 12 | 8,450 XP</p>
            </div>
            <button class="w-full bg-purple-600 p-3 rounded-lg font-bold">Claim Daily Reward</button>
        </div>
        <div id="tab-games" class="tab-content text-center p-4">Tic-Tac-Toe Game Logic Here</div>
        <div id="tab-tasks" class="tab-content text-center p-4">Tasks & Missions Module</div>
        <div id="tab-frens" class="tab-content text-center p-4">Referral Dashboard</div>
        <div id="tab-wallet" class="tab-content text-center p-4">Wallet & NFT Hub</div>
    </main>
    <nav class="fixed bottom-0 w-full bg-[#0d1117] flex justify-around p-4 border-t border-gray-800">
        <button onclick="switchTab('home')" class="text-purple-500"><i class="fa-solid fa-house"></i></button>
        <button onclick="switchTab('games')" class="text-gray-400"><i class="fa-solid fa-gamepad"></i></button>
        <button onclick="switchTab('tasks')" class="text-gray-400"><i class="fa-solid fa-list-check"></i></button>
        <button onclick="switchTab('frens')" class="text-gray-400"><i class="fa-solid fa-users"></i></button>
        <button onclick="switchTab('wallet')" class="text-gray-400"><i class="fa-solid fa-wallet"></i></button>
    </nav>
    <script>
        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
            document.getElementById('tab-' + id).classList.add('active-tab');
        }
    </script>
</body>
</html>
