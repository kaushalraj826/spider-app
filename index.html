<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spidercoin Wallet</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fadeUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-40px); }
        }
        .animate-fade-up { animation: fadeUp 0.8s ease-out forwards; }
    </style>
</head>
<body class="bg-neutral-950 text-white font-sans select-none max-w-md mx-auto h-screen flex flex-col justify-between overflow-hidden border-x border-neutral-800">

    <!-- Top Header -->
    <div class="flex justify-between items-center p-4 bg-neutral-900/60 backdrop-blur border-b border-neutral-800">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-600 to-red-600 flex items-center justify-center font-bold text-xs shadow-lg shadow-red-900/40">
                🕷️
            </div>
            <span class="font-extrabold tracking-wider text-sm bg-gradient-to-r from-amber-400 to-red-500 bg-clip-text text-transparent">
                Spidercoin Wallet
            </span>
        </div>
        <div class="bg-neutral-800 px-3 py-1.5 rounded-full text-xs font-bold border border-neutral-700 text-amber-400">
            v1.0
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="flex-1 overflow-y-auto p-4 flex flex-col items-center relative" id="main-container">
        
        <!-- Tap Section -->
        <div id="section-tap" class="flex flex-col items-center justify-center w-full flex-1">
            <div class="text-center mb-6">
                <div class="text-xs uppercase tracking-widest text-neutral-400 font-semibold mb-1">Total $SPDR</div>
                <div class="text-4xl font-black font-mono tracking-tight flex items-center justify-center gap-2 text-amber-400">
                    🪙 <span id="balance-text">1,500</span>
                </div>
            </div>

            <!-- Tap Coin Button -->
            <div class="relative my-4">
                <div class="absolute -inset-4 bg-gradient-to-r from-red-600 to-amber-600 rounded-full blur-xl opacity-30 animate-pulse"></div>
                <button id="tap-btn" class="relative w-52 h-52 rounded-full bg-gradient-to-b from-neutral-900 to-neutral-950 border-4 border-amber-500/50 shadow-2xl flex items-center justify-center active:scale-95 transition-transform duration-75 group overflow-hidden">
                    <div class="text-7xl group-hover:scale-110 transition duration-200">🕷️</div>
                </button>
            </div>

            <!-- Energy Bar -->
            <div class="w-full max-w-xs mt-8 bg-neutral-900 p-3 rounded-2xl border border-neutral-800">
                <div class="flex justify-between text-xs font-bold mb-1.5 text-neutral-400">
                    <span class="text-amber-400">⚡ Energy</span>
                    <span id="energy-text">1,000 / 1,000</span>
                </div>
                <div class="w-full h-3 bg-neutral-950 rounded-full overflow-hidden p-0.5 border border-neutral-800">
                    <div id="energy-bar" class="h-full bg-gradient-to-r from-amber-600 to-red-500 rounded-full transition-all duration-300" style="width: 100%;"></div>
                </div>
            </div>
        </div>

    </div>

    <!-- Bottom Navigation Bar -->
    <div class="flex justify-around items-center p-2 bg-neutral-900 border-t border-neutral-800 text-xs font-bold">
        <button onclick="switchTab('tap')" id="nav-tap" class="flex flex-col items-center gap-1 py-2 px-3 rounded-xl text-amber-400 bg-neutral-800/80">
            <span>🪙</span>
            <span class="text-[10px]">Tap</span>
        </button>
        <button onclick="switchTab('tasks')" id="nav-tasks" class="flex flex-col items-center gap-1 py-2 px-3 rounded-xl text-neutral-400">
            <span>🔥</span>
            <span class="text-[10px]">Tasks</span>
        </button>
        <button onclick="switchTab('friends')" id="nav-friends" class="flex flex-col items-center gap-1 py-2 px-3 rounded-xl text-neutral-400">
            <span>👥</span>
            <span class="text-[10px]">Friends</span>
        </button>
        <button onclick="switchTab('rank')" id="nav-rank" class="flex flex-col items-center gap-1 py-2 px-3 rounded-xl text-neutral-400">
            <span>🏆</span>
            <span class="text-[10px]">Rank</span>
        </button>
        <button onclick="switchTab('wallet')" id="nav-wallet" class="flex flex-col items-center gap-1 py-2 px-3 rounded-xl text-neutral-400">
            <span>👛</span>
            <span class="text-[10px]">Wallet</span>
        </button>
    </div>

    <script>
        let balance = 1500;
        let energy = 1000;
        const maxEnergy = 1000;

        const mainContainer = document.getElementById('main-container');

        // Energy Refill Loop
        setInterval(() => {
            if (energy < maxEnergy) {
                energy = Math.min(maxEnergy, energy + 5);
                const energyText = document.getElementById('energy-text');
                const energyBar = document.getElementById('energy-bar');
                if (energyText && energyBar) {
                    energyText.innerText = `${energy.toLocaleString()} / ${maxEnergy.toLocaleString()}`;
                    energyBar.style.width = `${(energy / maxEnergy) * 100}%`;
                }
            }
        }, 1000);

        // Global Tap Listener
        document.addEventListener('click', (e) => {
            if (e.target.id === 'tap-btn' || e.target.closest('#tap-btn')) {
                if (energy < 15) return;

                balance += 15;
                energy -= 15;

                const balanceText = document.getElementById('balance-text');
                const energyText = document.getElementById('energy-text');
                const energyBar = document.getElementById('energy-bar');

                if (balanceText) balanceText.innerText = balance.toLocaleString();
                if (energyText) energyText.innerText = `${energy.toLocaleString()} / ${maxEnergy.toLocaleString()}`;
                if (energyBar) energyBar.style.width = `${(energy / maxEnergy) * 100}%`;

                const btn = document.getElementById('tap-btn');
                const rect = btn.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;

                const floatEl = document.createElement('div');
                floatEl.className = 'absolute text-amber-300 font-black text-lg pointer-events-none animate-fade-up';
                floatEl.style.left = `${x}px`;
                floatEl.style.top = `${y}px`;
                floatEl.innerText = '+15';
                
                btn.appendChild(floatEl);
                setTimeout(() => floatEl.remove(), 800);
            }
        });

        // Tab Switching Logic
        function switchTab(tabName) {
            ['tap', 'tasks', 'friends', 'rank', 'wallet'].forEach(t => {
                const btn = document.getElementById(`nav-${t}`);
                if (btn) {
                    if (t === tabName) {
                        btn.className = "flex flex-col items-center gap-1 py-2 px-3 rounded-xl text-amber-400 bg-neutral-800/80";
                    } else {
                        btn.className = "flex flex-col items-center gap-1 py-2 px-3 rounded-xl text-neutral-400";
                    }
                }
            });

            if (tabName === 'tap') {
                mainContainer.innerHTML = `
                    <div id="section-tap" class="flex flex-col items-center justify-center w-full flex-1">
                        <div class="text-center mb-6">
                            <div class="text-xs uppercase tracking-widest text-neutral-400 font-semibold mb-1">Total $SPDR</div>
                            <div class="text-4xl font-black font-mono tracking-tight flex items-center justify-center gap-2 text-amber-400">
                                🪙 <span id="balance-text">${balance.toLocaleString()}</span>
                            </div>
                        </div>
                        <div class="relative my-4">
                            <div class="absolute -inset-4 bg-gradient-to-r from-red-600 to-amber-600 rounded-full blur-xl opacity-30 animate-pulse"></div>
                            <button id="tap-btn" class="relative w-52 h-52 rounded-full bg-gradient-to-b from-neutral-900 to-neutral-950 border-4 border-amber-500/50 shadow-2xl flex items-center justify-center active:scale-95 transition-transform duration-75 group overflow-hidden">
                                <div class="text-7xl group-hover:scale-110 transition duration-200">🕷️</div>
                            </button>
                        </div>
                        <div class="w-full max-w-xs mt-8 bg-neutral-900 p-3 rounded-2xl border border-neutral-800">
                            <div class="flex justify-between text-xs font-bold mb-1.5 text-neutral-400">
                                <span class="text-amber-400">⚡ Energy</span>
                                <span id="energy-text">${energy.toLocaleString()} / ${maxEnergy.toLocaleString()}</span>
                            </div>
                            <div class="w-full h-3 bg-neutral-950 rounded-full overflow-hidden p-0.5 border border-neutral-800">
                                <div id="energy-bar" class="h-full bg-gradient-to-r from-amber-600 to-red-500 rounded-full transition-all duration-300" style="width: ${(energy/maxEnergy)*100}%;"></div>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabName === 'tasks') {
                mainContainer.innerHTML = `
                    <div class="w-full flex-1 py-2">
                        <h2 class="text-base font-bold mb-3 text-amber-400">🔥 Earn More $SPDR</h2>
                        <div class="space-y-2.5">
                            <div class="flex items-center justify-between p-3 bg-neutral-900/60 border border-neutral-800 rounded-xl">
                                <div><div class="font-bold text-xs">Join Telegram Channel</div><div class="text-[10px] text-amber-400 font-semibold">+10,000 $SPDR</div></div>
                                <button onclick="alert('Task Completed!')" class="bg-gradient-to-r from-amber-500 to-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">Claim</button>
                            </div>
                            <div class="flex items-center justify-between p-3 bg-neutral-900/60 border border-neutral-800 rounded-xl">
                                <div><div class="font-bold text-xs">Follow on X (Twitter)</div><div class="text-[10px] text-amber-400 font-semibold">+5,000 $SPDR</div></div>
                                <button onclick="alert('Task Completed!')" class="bg-gradient-to-r from-amber-500 to-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">Claim</button>
                            </div>
                            <div class="flex items-center justify-between p-3 bg-neutral-900/60 border border-neutral-800 rounded-xl">
                                <div><div class="font-bold text-xs">Daily Login Bonus</div><div class="text-[10px] text-amber-400 font-semibold">+2,500 $SPDR</div></div>
                                <button onclick="alert('Claimed Successfully!')" class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold">Claimed</button>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabName === 'friends') {
                mainContainer.innerHTML = `
                    <div class="w-full flex-1 py-2 flex flex-col items-center">
                        <h2 class="text-base font-bold mb-1 text-amber-400">👥 Invite Friends</h2>
                        <p class="text-[11px] text-neutral-400 text-center mb-4">Get <span class="text-amber-400 font-bold">+25,000 $SPDR</span> for every friend you bring!</p>
                        <div class="w-full bg-neutral-900 border border-neutral-800 p-4 rounded-2xl mb-4 text-center">
                            <div class="text-xs text-neutral-400 mb-1">Your Referral Link</div>
                            <div class="bg-neutral-950 p-2 rounded-xl text-amber-400 font-mono text-xs border border-neutral-800 mb-3 truncate">t.me/Spidercoinwalletbot?start=ref123</div>
                            <button onclick="alert('Link Copied!')" class="w-full bg-gradient-to-r from-amber-500 to-red-600 py-2.5 rounded-xl text-xs font-extrabold shadow-lg">Copy Invite Link</button>
                        </div>
                    </div>
                `;
            } else if (tabName === 'rank') {
                mainContainer.innerHTML = `
                    <div class="w-full flex-1 py-2">
                        <h2 class="text-base font-bold mb-3 text-amber-400">🏆 Leaderboard</h2>
                        <div class="space-y-2">
                            <div class="flex items-center justify-between p-2.5 bg-neutral-900/60 border border-neutral-800 rounded-xl">
                                <span class="font-bold text-xs text-amber-400">#1 SpiderKing</span>
                                <span class="font-mono text-xs text-amber-400 font-bold">8,520,000 $SPDR</span>
                            </div>
                            <div class="flex items-center justify-between p-2.5 bg-neutral-900/60 border border-neutral-800 rounded-xl">
                                <span class="font-bold text-xs text-slate-300">#2 CryptoMaster</span>
                                <span class="font-mono text-xs text-amber-400 font-bold">6,100,000 $SPDR</span>
                            </div>
                            <div class="flex items-center justify-between p-2.5 bg-neutral-900/60 border border-neutral-800 rounded-xl">
                                <span class="font-bold text-xs text-amber-700">#3 TonWhale</span>
                                <span class="font-mono text-xs text-amber-400 font-bold">4,250,000 $SPDR</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (tabName === 'wallet') {
                mainContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center flex-1 text-center py-4">
                        <div class="w-14 h-14 bg-neutral-900 border border-neutral-800 rounded-3xl flex items-center justify-center text-amber-400 mb-3 shadow-xl text-2xl">👛</div>
                        <h2 class="text-base font-bold mb-1">Connect TON Wallet</h2>
                        <p class="text-xs text-neutral-400 max-w-xs mb-5">Link your wallet to claim $SPDR tokens directly during the upcoming airdrop.</p>
                        <button onclick="alert('Connecting Wallet...')" class="bg-gradient-to-r from-amber-500 to-red-600 px-6 py-3 rounded-2xl text-xs font-extrabold shadow-lg">Connect TON Wallet</button>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
